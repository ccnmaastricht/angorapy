[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "angorapy"
version = "0.11.0"
description = "Build Goal-driven Models of the Sensorimotor Cortex with Ease."
readme = "README.md"
license = { text = "GPL-3.0" }
authors = [{ name = "Tonio Weidler", email = "research@tonioweidler.de" }]
requires-python = ">=3.9,<3.12"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]

dependencies = [
    "imageio==2.28.1",
    "tensorflow[and-cuda]==2.19.*; platform_system == 'Linux'",
    "tensorflow==2.19.*; platform_system == 'Darwin'",
    "tensorflow_probability[tf]==0.25.*",
    "tensorflow_graphics==2021.12.3",
    "tensorflow_datasets",

    "tqdm",
    "simplejson",
    "psutil",
    "scipy",
    "argcomplete",
    "matplotlib",
    "scikit-learn==1.2.2",
    "pandas>=2,<3",
    "seaborn",
    "distance",
    "statsmodels==0.14.0",
    "kortex==0.1.0",
    "mediapy",

    # GPU monitoring (NVIDIA only).
    "nvidia-ml-py3; platform_system == 'Linux'",

    # Environments.
    "gymnasium[mujoco]==0.28.1",
    "mujoco==2.3.7; platform_system == 'Linux'",
    "mujoco>=3.0,<4; platform_system == 'Darwin'",
    "dm_control==1.0.12; platform_system == 'Linux'",
    "dm_control>=1.0.18; platform_system == 'Darwin'",
    "mujoco_utils",
    "tf_keras==2.19.*",

    # dev tools
    "pytest"
]

[project.optional-dependencies]
box2d = [
    "box2d-py==2.3.5",
    "gymnasium[mujoco,box2d]==0.28.1",
]
webinterface = [
    "itsdangerous==2.0.1",
    "werkzeug==2.0.3",
    "Flask~=1.1.2",
    "Jinja2==3.0.3",
    "bokeh==2.3.3",
    "flask_jsglue",
]

# Apple Silicon GPU acceleration via the Metal plugin (macOS only).
metal = [
    "tensorflow-metal; platform_system == 'Darwin'",
]

# Distributed (multi-worker) training via MPI. Optional: angorapy guards every
# mpi4py import and runs single-process without it. Requires a system MPI
# implementation (e.g. `brew install open-mpi`, or an openmpi module on HPC).
mpi = [
    "mpi4py",
]

[project.urls]
Homepage = "http://www.angorapy.org"

[tool.setuptools.packages.find]
include = ["angorapy*"]

[tool.setuptools.package-data]
angorapy = ["tasks/**/*", "monitor/**/*"]

[tool.uv.extra-build-dependencies]
box2d-py = ["swig"]
